name: Release Lavenders

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build application
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/Lavenders.UI/Lavenders.UI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$version -o publish
          if (-not (Test-Path publish/LICENSE.txt)) { throw "LICENSE.txt is missing from the release" }
          if (-not (Test-Path publish/THIRD-PARTY-NOTICES.md)) { throw "THIRD-PARTY-NOTICES.md is missing from the release" }

      - name: Install Velopack tools
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Run tests
        run: dotnet test Lavenders.slnx -c Release --no-restore

      - name: Download previous release metadata
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}

      - name: Package release
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          vpk pack --packId Lavenders.Calendar --packVersion $version --packDir publish --mainExe Lavenders.UI.exe --packTitle "Lavenders Calendar" --icon src/Lavenders.UI/Assets/Lavenders.ico

      - name: Publish GitHub release
        run: vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --publish --releaseName "Lavenders ${{ github.ref_name }}" --tag ${{ github.ref_name }}
